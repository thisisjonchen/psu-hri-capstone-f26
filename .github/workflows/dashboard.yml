name: Dashboard

on:
  push:
    paths: ['src/web/**', 'tools/pals.py', 'tools/peer_relay.py', 'src/scripts/localization/distance_guard.py', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['src/web/**', 'tools/pals.py', 'tools/peer_relay.py', 'src/scripts/localization/distance_guard.py', '.github/workflows/dashboard.yml']

permissions:
  contents: read

jobs:
  hardware-free:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r src/web/requirements.txt opencv-python-headless
      - run: python src/web/server.py --help
      - run: python tools/pals.py --help
      - run: python -m unittest discover -s src/web/tests -p "test_*.py"
      - run: node --test src/web/tests/dashboard.test.js
