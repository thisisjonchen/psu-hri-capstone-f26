# Heading is aligned automatically at node startup while disarmed and facing map +Y.
# Floor tag 5, printed top toward +Y, corrects yaw in all modes when visible.

# Velocity: IMU acceleration predicts, optical flow corrects; UWB has no input.
# The balance between them is set by these two noise values, not a fixed blend.
# IMU acceleration noise (m/s^2 per sqrt(Hz)); larger trusts flow more.
acceleration_stddev: 0.3
# Optical-flow velocity noise (m/s), assuming a textured floor; larger trusts the IMU more.
flow_velocity_stddev: 0.15
# How quickly the learned acceleration bias may change (m/s^2 per sqrt(s)).
acceleration_bias_stddev: 0.02
# Zero-velocity observation noise while disarmed/armed on the ground (m/s).
zero_velocity_stddev: 0.02
# Coast on IMU alone this long without a flow/zero-velocity correction (s).
velocity_timeout: 0.5
# Consecutive rejected flow samples before resetting velocity to flow.
flow_max_rejections: 5
# Preserve the earlier camera speed limit and rotation compensation.
max_flow_speed: 2.0
angular_compensation: 0.2

# Climb rate: IMU vertical acceleration predicts, tilt-compensated ToF height corrects.
vertical_acceleration_stddev: 0.3
vertical_bias_stddev: 0.05
tof_height_stddev: 0.02

# Room position: UWB corrects only the map->odom offset.
# Local odometry drift rate (m per sqrt(s)); larger lets UWB pull harder.
drift_stddev: 0.08
# Freshness for IMU/height and newly received fixes; the room pose itself
# survives UWB gaps up to 1.5 s (localization.fusion.XY_PREDICTION_TIMEOUT).
sensor_timeout: 0.5
max_sensor_skew: 0.15
# 99% chi-square gate for two-dimensional innovations (flow and UWB).
innovation_gate: 9.21
max_innovation: 1.0
