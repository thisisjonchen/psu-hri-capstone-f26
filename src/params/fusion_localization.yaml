# Heading is aligned automatically at node startup while disarmed and facing map +Y.
# Experimental: sensor replay has not established a flight benefit.
# Enabled for a controlled flight trial; startup bias is required before use.
use_imu_acceleration: true
# Residual horizontal accelerometer bias after the startup measurement (m/s^2),
# and how fast it may wander in flight (m/s^2 per sqrt(s)).
acceleration_bias_stddev: 0.15
acceleration_bias_drift: 0.01
velocity_stddev: 0.12
# Optical-flow velocity noise (m/s); sets how strongly flow corrects filter velocity.
# 1.2 keeps UWB dominant: flow supplies roughly 30% of velocity at hover (0.4 gave ~85%).
flow_velocity_stddev: 1.2
# Preserve the earlier camera speed limit and EMA rotation compensation.
max_flow_speed: 2.0
angular_compensation: 0.2
# Process uncertainty for predicted velocity (m/s per sqrt(s)).
acceleration_stddev: 0.3
drift_stddev: 0.08
# Freshness for IMU/height and newly received fixes; XY prediction has a shared 1 s limit.
sensor_timeout: 0.5
max_sensor_skew: 0.15
# 99% chi-square gate for a two-dimensional position innovation.
innovation_gate: 9.21
max_innovation: 1.0
