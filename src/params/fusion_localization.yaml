# IMU heading is forward measured counterclockwise from its startup X axis.
# Default: start facing map +Y when the flight controller initializes yaw to zero.
# Override with room heading of forward minus IMU yaw, radians; blank disables it.
room_yaw_offset: 1.5707963267948966
velocity_stddev: 0.12
drift_stddev: 0.08
velocity_tau: 0.08
flow_timeout: 0.25
sensor_timeout: 0.5
max_sensor_skew: 0.15
max_flow_speed: 2.0
angular_compensation: 0.2
# 99% chi-square gate for a two-dimensional position innovation.
innovation_gate: 9.21
max_innovation: 1.0
