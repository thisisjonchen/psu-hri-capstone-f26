# Horizontal velocity -> lean angle (scripts/velocity_controller.py), PX4/ArduPilot layout.
# Loaded by pid_controller.py at startup when /pidrone/velocity/controller is absent.
# velocity error (m/s) -> P + I -> acceleration
# -> lean = atan(acceleration / g), capped -> Betaflight angle-mode stick.
# Roll and pitch share these values.

# Acceleration per m/s of velocity error (1/s). Between the old roll (0.5 us per cm/s)
# and pitch (0.75) gains, which correspond to about 0.9 and 1.4.
gain_p: 1.2
# Integral gain (1/s^2), PX4's MPC_XY_VEL_I_ACC default. It learns a constant push
# (tilted IMU level, off-centre weight) and cancels it.
gain_i: 0.4
# The integral may hold at most this much lean (degrees).
i_limit_deg: 3.0
# Never command more lean than this (degrees). The old controller allowed about 3.3.
# Raise in steps as flights look good; keep well below 10.
max_lean_deg: 5.0
# Betaflight angle mode: degrees of lean at full stick (CLI: get angle_limit or
# get level_limit). 55 is the default until measured on the DD24.
angle_limit_deg: 55.0
