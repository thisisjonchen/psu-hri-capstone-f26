# Tilted-camera optical flow (scripts/optical_flow_node.py, localization/camera_flow.py).
# Camera mounting angles come from apriltag_mapping.yaml; the lens from camera_info.

# Encoder frame rate; each motion vector spans one frame interval.
framerate: 30.0
# Use only blocks whose ray meets the floor within this horizontal distance (m);
# rays near or above the horizon (room scenery) are ignored.
max_floor_distance: 1.5
# Fewer tracked floor blocks than this reads as no measurable motion
# (about 6 cm/s at 0.3 m: one pixel per frame with this lens).
min_blocks: 8
# Overall scale; calibrate against tape-measured hand-carried motion.
flow_gain: 1.0
# The Pi encoder's vector rows are vertically mirrored relative to the camera
# image on the DD24 (the image itself is not flipped). Without this, forward/back
# reads inverted and turning reads as sideways motion.
flip_vectors_vertically: true
