# AprilTag centers must lie on this horizontal plane in the UWB map (meters).
# For tags laid flat on the floor and UWB z=0 at that floor, leave at 0.
tag_plane_z: 0.0

# IMPORTANT: degrees BELOW HORIZONTAL (90 = straight down). The DD24 camera is
# mounted at about 45. Optical flow uses this same value.
camera_pitch_down_deg: 45.0
# Zero assumes optical axis tilts toward the drone's forward (+Y) direction.
# +90 means a tilt toward the drone's left (-X), due to RH rotation around Z.
camera_azimuth_deg: 0.0
# Image sensor rotated in its mounting plane? Adjust this from a measured fixture.
camera_image_roll_deg: 0.0

# Camera optical center RELATIVE TO UWB measurement point, in controller body:
# [right (+X), forward (+Y), up (+Z)] METERS. Measure on the real drone.
# Z=0 is ONLY a placeholder for a camera center at the UWB measurement point.
camera_offset_body: [0.0, 0.0, 0.0]

# Frame and maximum range; keep tight range for stable floor intersections.
frame_id: map
max_tag_distance: 3.0
# Photo and fused pose stamps must be near each other, in seconds.
max_image_pose_skew: 0.35
# Maximum deviation within a candidate cluster (meters). Larger moves start a
# new cluster; the last confirmed marker remains until that cluster is confirmed.
max_tag_jump: 0.35
# Average this many recent, consistent, distinct frames for initial placement
# and relocation. Observation gaps longer than max_image_pose_skew reset the window.
min_tag_samples: 3
