# Geometry in meters; PID startup loads this with coordination.yaml when
# /pidrone/coordination is absent. See scripts/PALS/COORDINATION.md.
nominal_separation_m: 1.0
payload_drop_m: 0.5
# payload_drop_m remains a planning value; it does not command altitude.

# Level drones, taut equal ropes, and a common payload attachment centered below
# the drone attachment points. Assumes attachment spacing equals drone spacing.
# Effective length per rope = sqrt(payload_drop_m^2 + (nominal_separation_m / 2)^2)
#                         = approximately 0.707 m; allow extra material for knots/fittings.
# The drop is measured between drone and payload attachment points, not to ground.
# Provisional unloaded separation limits live in coordination.yaml.
