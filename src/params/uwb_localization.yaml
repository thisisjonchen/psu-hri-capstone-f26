baud: 115200
min_quality: 50
stale_after: 0.5
max_sensor_skew: 0.15
rate: 20.0
reconnect_delay: 5.0
# Reconnect after this much serial silence (s), allowing for slow stationary updates.
serial_silence_timeout: 30.0
max_tilt_degrees: 45.0
# Per-fix standard deviation (m).
xy_stddev: 0.10
z_stddev: 0.03
